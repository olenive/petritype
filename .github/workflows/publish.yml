name: Publish

# Tag-driven release. PyPI version numbers are immutable and cannot be
# reused, so this goes to TestPyPI first, installs from there, and only
# then uploads to PyPI.
#
# Setup required once, by the repo owner, before this can work:
#   1. https://pypi.org/manage/account/publishing/      -> add a trusted publisher
#   2. https://test.pypi.org/manage/account/publishing/ -> same, for TestPyPI
#      owner: olenive / repo: petritype / workflow: publish.yml
#      environment: pypi  (and testpypi respectively)
#   3. Create the two GitHub environments under Settings -> Environments.
# No API tokens are needed; auth is OIDC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(uv version --short)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VER"
            exit 1
          fi
          echo "tag and version agree: $VER"

      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of the same version should not hard-fail the release.
          skip-existing: true

  verify-testpypi:
    name: install from TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TestPyPI does not mirror the real index, so dependencies (pydantic and
      # friends) must still be resolved from PyPI proper.
      - name: Install and import
        run: |
          SPEC="petritype"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then SPEC="petritype==${GITHUB_REF_NAME#v}"; fi
          for i in 1 2 3 4 5 6; do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "$SPEC"; then
              break
            fi
            echo "not visible yet, retrying in 20s ($i/6)"
            sleep 20
          done
          cd /tmp
          python -c "
          from petritype import petri_net
          import petritype.runtime, petritype.core.executable_graph_components
          print('TestPyPI artifact imports cleanly')
          "

  pypi:
    name: publish to PyPI
    needs: verify-testpypi
    # Tag-only. A manual workflow_dispatch stops after the TestPyPI rehearsal
    # above, so it can be used as a dry run without touching PyPI.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke:
    name: post-publish smoke test
    needs: pypi
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ github.ref_name }}
