name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # rustworkx.visualization.graphviz_draw shells out to `dot`; the notebook
      # tests assert on the PNG bytes it produces, so the binary is required.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Without a suffix every matrix leg computes the same key (the python
          # component resolves .python-version, identical across legs), so the
          # first job to finish owns the cache and the rest re-download their
          # per-ABI wheels every run.
          cache-suffix: py${{ matrix.python }}

      - name: Sync
        run: uv sync --python ${{ matrix.python }} --extra dev --extra examples

      # Run from the repo root: tests/helpers/io resolves fixture paths
      # relative to the process cwd, not to __file__.
      # Extras are named explicitly rather than relying on `uv run` syncing
      # inexactly (it installs what is missing but does not remove extras, so
      # the Sync step's work survives by default-behaviour rather than by
      # contract). This also matches copilot-instructions.md.
      - name: Unit tests
        run: uv run --python ${{ matrix.python }} --extra dev --extra examples pytest -q

      - name: Notebook tests
        run: uv run --python ${{ matrix.python }} --extra dev --extra examples pytest -m notebooks -q

  package:
    name: build + install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-suffix: package

      - name: Build
        run: uv build --out-dir dist

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      # A base install must work with pydantic alone. This is the regression
      # guard for dependency drift: if a core module grows an import that is
      # only declared in an extra, this fails here rather than for a user.
      - name: Base install imports (no extras)
        run: |
          uv venv /tmp/base --python 3.12
          uv pip install --python /tmp/base/bin/python dist/*.whl
          cd /tmp   # never import from the repo root, or the source tree shadows the install
          /tmp/base/bin/python - <<'PY'
          import importlib
          for mod in [
              "petritype",
              "petritype.runtime",
              "petritype.decorator",
              "petritype.core.executable_graph_components",
              "petritype.core.data_structures",
              "petritype.core.type_comparisons",
              "petritype.core.ast_extraction",
              "petritype.core.parse_modules",
              "petritype.core.relationship_graph_components",
              "petritype.core.descriptions",
              "petritype.helpers.structures",
              "petritype.helpers.io.io_helper",
          ]:
              importlib.import_module(mod)
          from petritype import petri_net  # public API re-export
          print("base install OK")
          PY

      - name: viz extra imports
        run: |
          uv venv /tmp/viz --python 3.12
          WHEEL="$(ls "$PWD"/dist/*.whl)"
          uv pip install --python /tmp/viz/bin/python "petritype[viz] @ file://${WHEEL}"
          cd /tmp
          /tmp/viz/bin/python -c "
          import petritype.plotting.rustworkx_graph
          import petritype.plotting.rustworkx_to_graphviz
          import petritype.plotting.simple_graphviz
          print('viz extra OK')
          "

      # Finding 12: the marimo extra was exercised nowhere, so marimo_controls
      # could grow a plotting import and every job would stay green (the
      # notebook suite runs in the everything-installed examples env).
      - name: marimo extra imports
        run: |
          uv venv /tmp/marimo --python 3.12
          WHEEL="$(ls "$PWD"/dist/*.whl)"
          uv pip install --python /tmp/marimo/bin/python "petritype[marimo] @ file://${WHEEL}"
          cd /tmp
          /tmp/marimo/bin/python -c "
          import petritype.marimo_controls
          print('marimo extra OK')
          "

      - name: marimo guard points at the extra on a base install
        run: |
          cd /tmp
          /tmp/base/bin/python - <<'PY'
          try:
              import petritype.marimo_controls
          except ModuleNotFoundError as exc:
              assert "petritype[marimo]" in str(exc), exc
              print("guard OK:", exc)
          else:
              raise SystemExit("expected marimo_controls to fail on a base install")
          PY

      # Finding 13: the quickstart lives in one place, examples/quickstart.py,
      # which is checked against the README block by the unit suite. Run a copy
      # from /tmp so the repo tree cannot shadow the installed package.
      - name: Quickstart runs against the base install
        run: |
          cp examples/quickstart.py /tmp/quickstart.py
          cd /tmp
          /tmp/base/bin/python /tmp/quickstart.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
