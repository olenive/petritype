name: PyPI smoke test

# Installs petritype the way a user would -- from PyPI, with no repo
# checkout -- and exercises it. Runs after a release, weekly, and on demand.

on:
  workflow_call:
    inputs:
      version:
        description: "Tag or version to require (e.g. v0.1.0). Empty means latest."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Tag or version to require (e.g. v0.1.0). Empty means latest."
        type: string
        required: false
        default: ""
  schedule:
    # Mondays 06:00 UTC. Catches a dependency release that breaks us.
    - cron: "0 6 * * 1"

env:
  # A fresh release takes a few minutes to reach every edge of PyPI's content
  # network: 0.3.1 took longer than the old two-minute budget on three of six
  # runners. Both install loops below poll at this interval for this many
  # attempts, ten minutes in all. A short fixed interval finds the earliest
  # moment the version appears; the probe is a tiny index fetch that fails fast.
  INSTALL_ATTEMPTS: "20"
  INSTALL_RETRY_SECONDS: "30"

jobs:
  # Until the first release, a scheduled run would fail red every Monday and
  # train everyone to ignore the workflow meant to catch real breakage. On a
  # schedule, skip when petritype is not on PyPI yet; dispatch and the
  # post-release call always run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      # curl verifies pypi.org against the runner's OS bundle; make sure it is the
      # one without the compromised eMudhra/emSign roots (October 2026).
      - name: Upgrade the OS CA bundle
        run: sudo apt-get update && sudo apt-get install -y --only-upgrade ca-certificates
      - id: check
        shell: bash
        run: |
          if curl -sfo /dev/null https://pypi.org/simple/petritype/; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::petritype is not on PyPI yet"
          fi

  install:
    name: pip install petritype (${{ matrix.os }}, py${{ matrix.python }})
    needs: preflight
    if: github.event_name != 'schedule' || needs.preflight.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The wheel is py3-none-any, so the OS axis tests the environment rather
      # than the artifact. Every interpreter is covered once, every OS once --
      # the full 3x3 cross-product bought no extra signal for nine jobs.
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # pip and curl below verify PyPI and GitHub against the runner's OS bundle
      # (Linux) and pip's own copy of certifi. Upgrade both, so the compromised
      # eMudhra/emSign roots (October 2026) are gone even on a runner image built
      # before the fix shipped. The macOS and Windows runners use their OS
      # stores, which are Apple's and Microsoft's to update.
      - name: Upgrade the OS CA bundle
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --only-upgrade ca-certificates
      - name: Upgrade pip
        shell: bash
        run: python -m pip install --upgrade "pip>=26.2.2"

      # Deliberately no actions/checkout: this must prove the published
      # artifact stands alone, with no source tree to fall back on.
      - name: Install from PyPI
        shell: bash
        # `version` reaches bash through the environment, never interpolated
        # into the script text: a ref name may legally contain backticks, $()
        # and semicolons, which would otherwise be executed.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SPEC="petritype"
          if [ -n "$VERSION" ]; then SPEC="petritype==${VERSION#v}"; fi
          # A freshly published release takes a few minutes to reach every
          # edge of PyPI's content network (the budget is set at the top).
          ok=""
          waited=0
          for i in $(seq 1 "$INSTALL_ATTEMPTS"); do
            if pip install "$SPEC"; then ok=1; break; fi
            echo "not installable yet after ${waited}s, retrying in ${INSTALL_RETRY_SECONDS}s ($i/$INSTALL_ATTEMPTS)"
            sleep "$INSTALL_RETRY_SECONDS"
            waited=$((waited + INSTALL_RETRY_SECONDS))
          done
          # A bare retry loop exits 0 when every attempt failed (its status is
          # the last `sleep`), so failure has to be raised explicitly.
          if [ -z "$ok" ]; then
            echo "::error::$SPEC not installable from PyPI after $INSTALL_ATTEMPTS attempts over ${waited}s"
            exit 1
          fi
          echo "installed after ${waited}s of waiting"
          pip show petritype

      - name: Base install imports
        shell: bash
        run: |
          python -P -c "
          from petritype import petri_net
          import petritype.runtime
          import petritype.core.executable_graph_components
          import petritype.core.type_comparisons
          print('imports OK')
          "

      # Finding 13: fetch the one canonical quickstart rather than keeping a
      # third inline copy that can drift. Pinned to the release tag when we
      # have one. Still no actions/checkout, so the artifact is exercised
      # without a source tree -- only this single file is fetched.
      - name: Quickstart produces the documented result
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          REF="${VERSION:-main}"
          curl -fsSL -o quickstart.py \
            "https://raw.githubusercontent.com/olenive/petritype/${REF}/examples/quickstart.py"
          python -P quickstart.py

  install-viz:
    name: pip install petritype[viz]
    needs: preflight
    if: github.event_name != 'schedule' || needs.preflight.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # As in the install job above: pip verifies PyPI against the runner's OS
      # bundle and its own copy of certifi.
      - name: Upgrade the OS CA bundle
        run: sudo apt-get update && sudo apt-get install -y --only-upgrade ca-certificates
      - name: Upgrade pip
        run: python -m pip install --upgrade "pip>=26.2.2"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install from PyPI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SPEC="petritype[viz]"
          if [ -n "$VERSION" ]; then SPEC="petritype[viz]==${VERSION#v}"; fi
          ok=""
          waited=0
          for i in $(seq 1 "$INSTALL_ATTEMPTS"); do
            if pip install "$SPEC"; then ok=1; break; fi
            echo "not installable yet after ${waited}s, retrying in ${INSTALL_RETRY_SECONDS}s ($i/$INSTALL_ATTEMPTS)"
            sleep "$INSTALL_RETRY_SECONDS"
            waited=$((waited + INSTALL_RETRY_SECONDS))
          done
          if [ -z "$ok" ]; then
            echo "::error::$SPEC not installable from PyPI after $INSTALL_ATTEMPTS attempts over ${waited}s"
            exit 1
          fi
          echo "installed after ${waited}s of waiting"

      - name: Rendering imports and draws
        shell: bash
        run: |
          python -P -c "
          import petritype.plotting.simple_graphviz
          import petritype.plotting.rustworkx_to_graphviz
          import petritype.plotting.rustworkx_graph
          from rustworkx import PyDiGraph
          from rustworkx.visualization import graphviz_draw
          g = PyDiGraph(); a = g.add_node('a'); b = g.add_node('b'); g.add_edge(a, b, None)
          img = graphviz_draw(g, node_attr_fn=lambda n: {'label': str(n)})
          assert img is not None
          print('viz extra OK, dot reachable')
          "
