name: PyPI smoke test

# Installs petritype the way a user would -- from PyPI, with no repo
# checkout -- and exercises it. Runs after a release, weekly, and on demand.

on:
  workflow_call:
    inputs:
      version:
        description: "Tag or version to require (e.g. v0.1.0). Empty means latest."
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Tag or version to require (e.g. v0.1.0). Empty means latest."
        type: string
        required: false
        default: ""
  schedule:
    # Mondays 06:00 UTC. Catches a dependency release that breaks us.
    - cron: "0 6 * * 1"

jobs:
  # Until the first release, a scheduled run would fail red every Monday and
  # train everyone to ignore the workflow meant to catch real breakage. On a
  # schedule, skip when petritype is not on PyPI yet; dispatch and the
  # post-release call always run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        shell: bash
        run: |
          if curl -sfo /dev/null https://pypi.org/simple/petritype/; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::petritype is not on PyPI yet"
          fi

  install:
    name: pip install petritype (${{ matrix.os }}, py${{ matrix.python }})
    needs: preflight
    if: github.event_name != 'schedule' || needs.preflight.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The wheel is py3-none-any, so the OS axis tests the environment rather
      # than the artifact. Every interpreter is covered once, every OS once --
      # the full 3x3 cross-product bought no extra signal for nine jobs.
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Deliberately no actions/checkout: this must prove the published
      # artifact stands alone, with no source tree to fall back on.
      - name: Install from PyPI
        shell: bash
        # `version` reaches bash through the environment, never interpolated
        # into the script text: a ref name may legally contain backticks, $()
        # and semicolons, which would otherwise be executed.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SPEC="petritype"
          if [ -n "$VERSION" ]; then SPEC="petritype==${VERSION#v}"; fi
          # A freshly published release takes a moment to reach the CDN.
          ok=""
          for i in 1 2 3 4 5 6; do
            if pip install "$SPEC"; then ok=1; break; fi
            echo "not installable yet, retrying in 20s ($i/6)"
            sleep 20
          done
          # A bare retry loop exits 0 when every attempt failed (its status is
          # the last `sleep`), so failure has to be raised explicitly.
          if [ -z "$ok" ]; then
            echo "::error::$SPEC not installable from PyPI after 6 attempts"
            exit 1
          fi
          pip show petritype

      - name: Base install imports
        shell: bash
        run: |
          python -c "
          from petritype import petri_net
          import petritype.runtime
          import petritype.core.executable_graph_components
          import petritype.core.type_comparisons
          print('imports OK')
          "

      # Finding 13: fetch the one canonical quickstart rather than keeping a
      # third inline copy that can drift. Pinned to the release tag when we
      # have one. Still no actions/checkout, so the artifact is exercised
      # without a source tree -- only this single file is fetched.
      - name: Quickstart produces the documented result
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          REF="${VERSION:-main}"
          curl -fsSL -o quickstart.py \
            "https://raw.githubusercontent.com/olenive/petritype/${REF}/examples/quickstart.py"
          python quickstart.py

  install-viz:
    name: pip install petritype[viz]
    needs: preflight
    if: github.event_name != 'schedule' || needs.preflight.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install from PyPI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SPEC="petritype[viz]"
          if [ -n "$VERSION" ]; then SPEC="petritype[viz]==${VERSION#v}"; fi
          ok=""
          for i in 1 2 3 4 5 6; do
            if pip install "$SPEC"; then ok=1; break; fi
            echo "not installable yet, retrying in 20s ($i/6)"
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::$SPEC not installable from PyPI after 6 attempts"
            exit 1
          fi

      - name: Rendering imports and draws
        shell: bash
        run: |
          python -c "
          import petritype.plotting.simple_graphviz
          import petritype.plotting.rustworkx_to_graphviz
          import petritype.plotting.rustworkx_graph
          from rustworkx import PyDiGraph
          from rustworkx.visualization import graphviz_draw
          g = PyDiGraph(); a = g.add_node('a'); b = g.add_node('b'); g.add_edge(a, b, None)
          img = graphviz_draw(g, node_attr_fn=lambda n: {'label': str(n)})
          assert img is not None
          print('viz extra OK, dot reachable')
          "
