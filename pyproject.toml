[project]
name = "petritype"
version = "0.5.0"
description = "Typed, executable, visual Petri nets in Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE-MIT"]
authors = [{ name = "Oleg Lenive", email = "oleg@manifold-exp.com" }]
keywords = [
    "petri-net",
    "workflow",
    "pipeline",
    "dataflow",
    "concurrency",
    "type-checking",
    "visualisation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    # Pinned exactly: a new pyright release can report new errors, and the type-check
    # gate (`just typecheck`) should change only when this line does. The package
    # bundles pyright and runs it on the `node` on PATH; with none, it downloads Node
    # into its own cache on its first run.
    "pyright==1.1.414",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8",
]
# Graph rendering: petritype.plotting.*. Also needs the Graphviz `dot` binary
# on PATH (e.g. `brew install graphviz` / `apt install graphviz`).
# pillow is a direct requirement of rustworkx.visualization.graphviz_draw, which
# raises ImportError without it; rustworkx does not declare it.
viz = [
    "pillow>=9",
    "rustworkx>=0.18.0",
]
# Interactive notebook controls: petritype.marimo_controls.
marimo = [
    "marimo>=0.23.9",
]
examples = [
    "petritype[viz]",
    "petritype[marimo]",
    # Imported directly by examples/time_series_stats/*.
    "matplotlib>=3.11.0",
    "numpy>=1.25",
]

[project.urls]
Homepage = "https://github.com/olenive/petritype"
Repository = "https://github.com/olenive/petritype"
Issues = "https://github.com/olenive/petritype/issues"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E402: optional-extra modules call petritype._optional.require(...) before importing the extra.
# E501: long docstrings and inline comments are allowed.
# B905: intentional unequal-length zip(...) calls (e.g. pairwise slices).
ignore = ["E402", "E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# B018: a marimo cell shows the value of its last expression, and names a widget on a
# line of its own to run again when the widget changes.
"examples/**" = ["B018"]

[tool.pyright]
# The type-check gate (`just typecheck`, the typecheck job in CI): code written the
# way a user writes it, against the public API, must type-check. That is the promise
# petritype/py.typed makes. The library's own modules are not checked here.
# examples/quickstart.py is the README's quickstart, which a test keeps identical to it.
include = ["tests/typecheck", "examples/quickstart.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
# The single test suite lives in tests/. Pinned so collection can't silently pick up
# a stray top-level test/ directory again (the old suite was reconciled into tests/).
testpaths = ["tests"]
markers = [
    "notebooks: run the marimo example notebooks (slow; needs the 'examples' extra). Deselected by default; run with `pytest -m notebooks`.",
]
# Skip the notebook suite on a plain `pytest` run. Override on the command line with
# `pytest -m notebooks` to run only them.
addopts = "-m 'not notebooks'"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
# Nothing in the resolved tree depends on certifi today. Should a dependency ever
# pull it in, it must resolve to a bundle without the compromised eMudhra/emSign
# roots (GHSA-6q48-6c7w-9gw2, October 2026). Recorded in uv.lock under [manifest].
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root, not under src/.
module-root = ""
module-name = "petritype"
