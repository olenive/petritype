[project]
name = "petritype"
version = "0.1.1"
description = "Typed, executable, visual Petri nets in Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE-MIT"]
authors = [{ name = "Oleg Lenive", email = "oleg@manifold-exp.com" }]
keywords = [
    "petri-net",
    "workflow",
    "pipeline",
    "dataflow",
    "concurrency",
    "type-checking",
    "visualisation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
# Graph rendering: petritype.plotting.*. Also needs the Graphviz `dot` binary
# on PATH (e.g. `brew install graphviz` / `apt install graphviz`).
# pillow is a direct requirement of rustworkx.visualization.graphviz_draw, which
# raises ImportError without it; rustworkx does not declare it, and it reaches us
# today only because matplotlib happens to pull it in.
viz = [
    "matplotlib>=3.11.0",
    "pillow>=9",
    "rustworkx>=0.18.0",
]
# Interactive notebook controls: petritype.marimo_controls.
marimo = [
    "marimo>=0.23.9",
]
examples = [
    "petritype[viz]",
    "petritype[marimo]",
    # Imported directly by examples/time_series_stats/*.
    "numpy>=1.25",
]

[project.urls]
Homepage = "https://github.com/olenive/petritype"
Repository = "https://github.com/olenive/petritype"
Issues = "https://github.com/olenive/petritype/issues"

[tool.pytest.ini_options]
# The single test suite lives in tests/. Pinned so collection can't silently pick up
# a stray top-level test/ directory again (the old suite was reconciled into tests/).
testpaths = ["tests"]
markers = [
    "notebooks: run the marimo example notebooks (slow; needs the 'examples' extra). Deselected by default; run with `pytest -m notebooks`.",
]
# Skip the notebook suite on a plain `pytest` run. Override on the command line with
# `pytest -m notebooks` to run only them.
addopts = "-m 'not notebooks'"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root, not under src/.
module-root = ""
module-name = "petritype"
